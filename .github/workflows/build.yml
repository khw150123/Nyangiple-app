name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate project
        run: |
          set -e
          mkdir -p proj && cd proj
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'NYANGIPLE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.nyangiple.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.nyangiple.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          NYANGIPLE_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'NYANGIPLE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="냥이플"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.Nyangiple">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          NYANGIPLE_EOF
          mkdir -p "app/src/main/java/com/nyangiple/app"
          cat > "app/src/main/java/com/nyangiple/app/MainActivity.kt" <<'NYANGIPLE_EOF'
          package com.nyangiple.app

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.ImageButton
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : AppCompatActivity() {

              private val homeUrl = "https://khw150123.github.io/Nyangiple/"
              private val barColor = 0xFF171C22.toInt()

              private lateinit var webView: WebView
              private lateinit var splash: View
              private lateinit var bottomBar: View
              private lateinit var fullscreenContainer: FrameLayout
              private lateinit var btnBack: ImageButton
              private lateinit var btnForward: ImageButton

              private var customView: View? = null
              private var customViewCallback: WebChromeClient.CustomViewCallback? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // 상태바(노치 영역)/하단 내비게이션바 색상 #171C22
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  @Suppress("DEPRECATION")
                  run {
                      window.statusBarColor = barColor
                      window.navigationBarColor = barColor
                  }
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      isAppearanceLightStatusBars = false
                      isAppearanceLightNavigationBars = false
                  }

                  setContentView(R.layout.activity_main)

                  val root = findViewById<View>(R.id.root)
                  ViewCompat.setOnApplyWindowInsetsListener(root) { v, insets ->
                      val bars = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout()
                      )
                      val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                      v.setPadding(bars.left, bars.top, bars.right, maxOf(bars.bottom, ime.bottom))
                      insets
                  }

                  webView = findViewById(R.id.webView)
                  splash = findViewById(R.id.splash)
                  bottomBar = findViewById(R.id.bottomBar)
                  fullscreenContainer = findViewById(R.id.fullscreenContainer)
                  btnBack = findViewById(R.id.btnBack)
                  btnForward = findViewById(R.id.btnForward)

                  setupWebView()

                  btnBack.setOnClickListener { if (webView.canGoBack()) webView.goBack() }
                  btnForward.setOnClickListener { if (webView.canGoForward()) webView.goForward() }
                  findViewById<View>(R.id.btnHome).setOnClickListener { webView.loadUrl(homeUrl) }
                  findViewById<View>(R.id.btnRefresh).setOnClickListener { webView.reload() }

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState)
                      splash.visibility = View.GONE
                  } else {
                      webView.loadUrl(homeUrl)
                      // 스플래시 1초 후 사이트 화면으로 (그동안 뒤에서 사이트 로딩)
                      Handler(Looper.getMainLooper()).postDelayed({ splash.visibility = View.GONE }, 1000)
                  }
                  updateNavButtons()
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      allowFileAccess = true
                      loadWithOverviewMode = true
                      useWideViewPort = true
                      javaScriptCanOpenWindowsAutomatically = true
                      setSupportMultipleWindows(false)
                  }
                  CookieManager.getInstance().apply {
                      setAcceptCookie(true)
                      setAcceptThirdPartyCookies(webView, true)
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val scheme = request.url.scheme ?: return false
                          if (scheme in listOf("http", "https", "file", "about", "data", "blob", "javascript")) return false
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(request.url.toString())))
                          } catch (_: Exception) {
                          }
                          return true
                      }

                      override fun onPageStarted(view: WebView, url: String?, favicon: Bitmap?) = updateNavButtons()
                      override fun onPageFinished(view: WebView, url: String?) = updateNavButtons()
                      override fun doUpdateVisitedHistory(view: WebView, url: String?, isReload: Boolean) = updateNavButtons()
                  }

                  // 동영상 전체화면 지원
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowCustomView(view: View, callback: CustomViewCallback) {
                          if (customView != null) {
                              callback.onCustomViewHidden()
                              return
                          }
                          customView = view
                          customViewCallback = callback
                          fullscreenContainer.addView(
                              view,
                              FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          )
                          fullscreenContainer.visibility = View.VISIBLE
                          bottomBar.visibility = View.GONE
                          WindowInsetsControllerCompat(window, window.decorView).apply {
                              systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                              hide(WindowInsetsCompat.Type.systemBars())
                          }
                      }

                      override fun onHideCustomView() = exitFullscreen()
                  }
              }

              private fun exitFullscreen() {
                  val view = customView ?: return
                  fullscreenContainer.removeView(view)
                  fullscreenContainer.visibility = View.GONE
                  bottomBar.visibility = View.VISIBLE
                  customViewCallback?.onCustomViewHidden()
                  customView = null
                  customViewCallback = null
                  WindowInsetsControllerCompat(window, window.decorView).show(WindowInsetsCompat.Type.systemBars())
              }

              private fun updateNavButtons() {
                  btnBack.alpha = if (webView.canGoBack()) 1f else 0.35f
                  btnForward.alpha = if (webView.canGoForward()) 1f else 0.35f
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  when {
                      customView != null -> exitFullscreen()
                      webView.canGoBack() -> webView.goBack()
                      else -> @Suppress("DEPRECATION") super.onBackPressed()
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onPause() {
                  super.onPause()
                  webView.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  webView.onResume()
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }
          }
          NYANGIPLE_EOF
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_back.xml" <<'NYANGIPLE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/>
          </vector>
          NYANGIPLE_EOF
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_forward.xml" <<'NYANGIPLE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,4l-1.41,1.41L16.17,11H4v2h12.17l-5.58,5.59L12,20l8,-8z"/>
          </vector>
          NYANGIPLE_EOF
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_home.xml" <<'NYANGIPLE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/>
          </vector>
          NYANGIPLE_EOF
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_refresh.xml" <<'NYANGIPLE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/>
          </vector>
          NYANGIPLE_EOF
          mkdir -p "app/src/main/res/layout"
          cat > "app/src/main/res/layout/activity_main.xml" <<'NYANGIPLE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#171C22">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical">

                  <FrameLayout
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1">

                      <WebView
                          android:id="@+id/webView"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent" />

                      <FrameLayout
                          android:id="@+id/fullscreenContainer"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:background="#000000"
                          android:visibility="gone" />
                  </FrameLayout>

                  <LinearLayout
                      android:id="@+id/bottomBar"
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:background="#171C22"
                      android:orientation="horizontal">

                      <ImageButton
                          android:id="@+id/btnBack"
                          style="@style/BarButton"
                          android:contentDescription="뒤로가기"
                          android:src="@drawable/ic_back" />

                      <ImageButton
                          android:id="@+id/btnForward"
                          style="@style/BarButton"
                          android:contentDescription="앞으로가기"
                          android:src="@drawable/ic_forward" />

                      <ImageButton
                          android:id="@+id/btnHome"
                          style="@style/BarButton"
                          android:contentDescription="홈"
                          android:src="@drawable/ic_home" />

                      <ImageButton
                          android:id="@+id/btnRefresh"
                          style="@style/BarButton"
                          android:contentDescription="새로고침"
                          android:src="@drawable/ic_refresh" />
                  </LinearLayout>
              </LinearLayout>

              <ImageView
                  android:id="@+id/splash"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#FAFAFA"
                  android:scaleType="centerCrop"
                  android:src="@drawable/splash"
                  android:contentDescription="냥이플" />
          </FrameLayout>
          NYANGIPLE_EOF
          mkdir -p "app/src/main/res/values"
          cat > "app/src/main/res/values/themes.xml" <<'NYANGIPLE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Nyangiple" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:statusBarColor">#171C22</item>
                  <item name="android:navigationBarColor">#171C22</item>
                  <item name="android:windowBackground">#171C22</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

              <style name="BarButton">
                  <item name="android:layout_width">0dp</item>
                  <item name="android:layout_height">match_parent</item>
                  <item name="android:layout_weight">1</item>
                  <item name="android:background">?android:attr/selectableItemBackgroundBorderless</item>
                  <item name="android:scaleType">center</item>
              </style>
          </resources>
          NYANGIPLE_EOF
          cat > "build.gradle.kts" <<'NYANGIPLE_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          NYANGIPLE_EOF
          cat > "gradle.properties" <<'NYANGIPLE_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          NYANGIPLE_EOF
          cat > "settings.gradle.kts" <<'NYANGIPLE_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Nyangiple"
          include(":app")
          NYANGIPLE_EOF
          mkdir -p app/src/main/res/drawable
          base64 -d > app/src/main/res/drawable/splash.png <<'NYANGIPLE_B64'
